# Run test.py on every supported Python version.
name: test

on:
  push:
  pull_request:
  workflow_call:    # lets release.yml run the tests before publishing

jobs:
  # Versions provided by actions/setup-python.
  current:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "pypy3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python test.py
      - run: python -O test.py

  # Versions setup-python no longer provides. Docker is run directly rather
  # than with a job-level "container:", because actions/checkout cannot run
  # inside the oldest images.
  old:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.3", "3.4", "3.5", "3.6", "3.7"]
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD":/src -w /src python:${{ matrix.python }} python test.py
